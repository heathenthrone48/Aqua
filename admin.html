<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin Panel - Stock Control</title>
  <style>
    :root {
      --primary: #0284c7;
      --bg: #f8fafc;
      --surface: #ffffff;
      --text: #0f172a;
      --border: #e2e8f0;
      --danger: #dc2626;
      --success: #16a34a;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: system-ui, -apple-system, sans-serif;
    }

    body {
      background-color: var(--bg);
      color: var(--text);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 20px;
    }

    /* Auth Screen Overlay */
    #authOverlay {
      position: fixed;
      inset: 0;
      background: rgba(15, 23, 42, 0.9);
      display: flex;
      justify-content: center;
      align-items: center;
      z-index: 1000;
    }

    .card {
      background: var(--surface);
      padding: 32px;
      border-radius: 12px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.1);
      width: 100%;
      max-width: 400px;
      text-align: center;
    }

    .card h2 {
      margin-bottom: 8px;
    }

    .card p {
      font-size: 0.9rem;
      color: #64748b;
      margin-bottom: 20px;
    }

    .input-field {
      width: 100%;
      padding: 10px 14px;
      border: 1px solid var(--border);
      border-radius: 6px;
      font-size: 1rem;
      margin-bottom: 12px;
      outline: none;
    }

    .input-field:focus {
      border-color: var(--primary);
    }

    .btn {
      width: 100%;
      background: var(--primary);
      color: white;
      border: none;
      padding: 12px;
      border-radius: 6px;
      font-weight: 600;
      cursor: pointer;
      font-size: 1rem;
    }

    .btn:hover {
      opacity: 0.9;
    }

    .error-msg {
      color: var(--danger);
      font-size: 0.85rem;
      margin-top: 8px;
      display: none;
    }

    /* Control Panel UI */
    .status-box {
      padding: 16px;
      border-radius: 8px;
      margin: 20px 0;
      font-weight: 600;
      font-size: 1.1rem;
    }

    .in-stock {
      background-color: #dcfce7;
      color: var(--success);
      border: 1px solid #bbf7d0;
    }

    .out-of-stock {
      background-color: #fee2e2;
      color: var(--danger);
      border: 1px solid #fecaca;
    }

    .toggle-btn {
      padding: 12px 20px;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: 600;
      width: 100%;
      transition: background 0.2s;
    }

    .btn-out {
      background-color: var(--danger);
      color: white;
    }

    .btn-in {
      background-color: var(--success);
      color: white;
    }

    .logout-link {
      display: inline-block;
      margin-top: 20px;
      color: #64748b;
      text-decoration: none;
      font-size: 0.85rem;
      cursor: pointer;
    }

    .logout-link:hover {
      color: var(--text);
    }
  </style>
</head>
<body>

  <!-- Password Authentication -->
  <div id="authOverlay">
    <div class="card">
      <h2>Admin Access</h2>
      <p>Enter key to manage store stock</p>
      <input type="password" id="adminPasswordInput" class="input-field" placeholder="Enter password" onkeydown="if(event.key==='Enter') verifyPassword()">
      <button class="btn" onclick="verifyPassword()">Login</button>
      <div id="authError" class="error-msg">Incorrect password. Try again.</div>
    </div>
  </div>

  <!-- Admin Control Panel -->
  <div class="card" id="adminPanel" style="display: none;">
    <h2>Stock Management</h2>
    <p>Toggle availability to enable or block orders on main page</p>

    <div id="statusIndicator" class="status-box in-stock">
      Status: IN STOCK
    </div>

    <button id="toggleBtn" class="toggle-btn btn-out" onclick="toggleStock()">
      Set to Out of Stock
    </button>

    <div>
      <span class="logout-link" onclick="logoutAdmin()">Log out</span>
    </div>
  </div>

  <script>
    const ADMIN_PASSWORD = "admin"; // Set your password here

    document.addEventListener('DOMContentLoaded', () => {
      if (sessionStorage.getItem('adminAuthenticated') === 'true') {
        showPanel();
      }
    });

    function verifyPassword() {
      const input = document.getElementById('adminPasswordInput').value;
      const errorMsg = document.getElementById('authError');

      if (input === ADMIN_PASSWORD) {
        sessionStorage.setItem('adminAuthenticated', 'true');
        errorMsg.style.display = 'none';
        showPanel();
      } else {
        errorMsg.style.display = 'block';
      }
    }

    function logoutAdmin() {
      sessionStorage.removeItem('adminAuthenticated');
      document.getElementById('authOverlay').style.display = 'flex';
      document.getElementById('adminPanel').style.display = 'none';
      document.getElementById('adminPasswordInput').value = '';
    }

    function showPanel() {
      document.getElementById('authOverlay').style.display = 'none';
      document.getElementById('adminPanel').style.display = 'block';
      updateUI();
    }

    function toggleStock() {
      const isOutOfStock = localStorage.getItem('isOutOfStock') === 'true';
      // Flip the status
      localStorage.setItem('isOutOfStock', !isOutOfStock);
      updateUI();
    }

    function updateUI() {
      const isOutOfStock = localStorage.getItem('isOutOfStock') === 'true';
      const statusIndicator = document.getElementById('statusIndicator');
      const toggleBtn = document.getElementById('toggleBtn');

      if (isOutOfStock) {
        statusIndicator.textContent = "Status: OUT OF STOCK";
        statusIndicator.className = "status-box out-of-stock";
        toggleBtn.textContent = "Set to In Stock";
        toggleBtn.className = "toggle-btn btn-in";
      } else {
        statusIndicator.textContent = "Status: IN STOCK";
        statusIndicator.className = "status-box in-stock";
        toggleBtn.textContent = "Set to Out of Stock";
        toggleBtn.className = "toggle-btn btn-out";
      }
    }
  </script>
</body>
</html>
